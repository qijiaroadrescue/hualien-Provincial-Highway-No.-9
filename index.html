<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>台9線花蓮段路況 (145K-305K)</title>
<style>
:root { --bg:#121212; --card:#1e1e1e; --line:#2d2d2d; --green:#34a853; --red:#ea4335; --muted:#9aa0a6; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(88px + env(safe-area-inset-bottom, 0px));
}
header { text-align: center; padding: 6px 0 14px; }
header h1 { margin: 0; font-size: 1.25rem; color: var(--green); }
header p { margin: 6px 0 0; font-size: .8rem; color: var(--muted); }

.notice { background: #2a2416; border: 1px solid #5c4a1a; color: #f2d58a; border-radius: 12px; padding: 10px 12px; font-size: .8rem; line-height: 1.5; margin-bottom: 14px; }
.notice a { color: #ffd76a; font-weight: bold; }

.list { display: flex; flex-direction: column; gap: 10px; }
.seg {
  display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 68px;
}
.seg:active { background: #262626; transform: scale(.99); }
.num { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--green); display: grid; place-items: center; font-weight: bold; }
.info { flex: 1; min-width: 0; }
.km { font-size: 1.05rem; font-weight: bold; }
.towns { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.go { flex: none; font-size: .8rem; font-weight: bold; color: var(--green); white-space: nowrap; }

.how { margin-top: 16px; font-size: .75rem; color: var(--muted); line-height: 1.6; text-align: center; }
.how .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px 0 8px; vertical-align: -1px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: rgba(18,18,18,.96); border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
}
.bar-title { text-align: center; font-size: .7rem; color: var(--muted); margin-bottom: 6px; }
.btns { display: flex; gap: 8px; }
.btns a { flex: 1; text-align: center; padding: 13px 4px; border-radius: 12px; font-weight: bold; font-size: .95rem; color: #fff; text-decoration: none; }
.call { background: var(--red); flex: 1.4 !important; }
.line { background: #06c755; }
.site { background: #333; border: 1px solid #555; }
</style>
</head>
<body>

<header>
  <h1>🚗 台9線花蓮段即時路況</h1>
  <p>145K ～ 305K｜點選路段，開啟 Google 地圖路況</p>
</header>

<div class="notice">
  ⚠️ Google 路況只顯示車速。封路、施工、管制請查
  <a href="https://qijiaroadrescue.com/road-status/" target="_blank" rel="noopener">宜花東即時路況與管制</a>
  或公路局公告。
</div>

<main class="list" id="list"></main>

<div class="how">
  地圖上的顏色：
  <span class="dot" style="background:#34a853"></span>順暢
  <span class="dot" style="background:#f9a825"></span>車多
  <span class="dot" style="background:#ea4335"></span>壅塞
</div>

<nav class="bar">
  <div class="bar-title">🚨 拋錨、爆胎、沒電、事故？啟佳道路救援 24 小時</div>
  <div class="btns">
    <a class="call" href="tel:0937165037">📞 立即撥打</a>
    <a class="line" href="https://page.line.me/0937_165037?openQrModal=true" target="_blank" rel="noopener">💬 LINE</a>
    <a class="site" href="https://qijiaroadrescue.com/" target="_blank" rel="noopener">官網</a>
  </div>
</nav>

<script>
// 每段 20K：km 範圍、沿線地名、地圖中心(lat,lng)、縮放 z。座標不準時改這裡。
const ROADS = [
  { km: "145K – 165K", towns: "和平・和仁・崇德",         lat: 24.235, lng: 121.71, z: 12 },
  { km: "165K – 185K", towns: "崇德・新城・北埔",         lat: 24.14,  lng: 121.63, z: 12 },
  { km: "185K – 205K", towns: "花蓮市區・吉安・壽豐",     lat: 23.95,  lng: 121.57, z: 12 },
  { km: "205K – 225K", towns: "壽豐・溪口・鳳林",         lat: 23.78,  lng: 121.49, z: 12 },
  { km: "225K – 245K", towns: "鳳林・光復・大農大富",     lat: 23.67,  lng: 121.42, z: 12 },
  { km: "245K – 265K", towns: "光復・瑞穗・舞鶴",         lat: 23.53,  lng: 121.38, z: 12 },
  { km: "265K – 285K", towns: "瑞穗・三民・玉里",         lat: 23.40,  lng: 121.33, z: 12 },
  { km: "285K – 305K", towns: "東里・富里・竹田",         lat: 23.22,  lng: 121.27, z: 12 },
];
const list = document.getElementById('list');
ROADS.forEach((r, i) => {
  const a = document.createElement('a');
  a.className = 'seg';
  a.target = '_blank'; a.rel = 'noopener';
  a.href = `https://www.google.com/maps/@${r.lat},${r.lng},${r.z}z/data=!5m1!1e1`; // !5m1!1e1 = 即時路況圖層
  a.innerHTML = `<div class="num">${i + 1}</div>
    <div class="info"><div class="km">${r.km}</div><div class="towns">${r.towns}</div></div>
    <div class="go">看路況 ›</div>`;
  list.appendChild(a);
});
</script>
</body>
</html>
